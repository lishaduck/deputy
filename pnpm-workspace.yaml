hoist: false
strictPeerDependencies: true
autoInstallPeers: false
strictDepBuilds: true
shellEmulator: true
engineStrict: true
nodeVersion: "20.19.0"
ignorePatchFailures: false
verifyDepsBeforeRun: warn
disallowWorkspaceCycles: true
enableGlobalVirtualStore: true
catalogMode: strict

ignoredBuiltDependencies:
  - esbuild
  - oxc-resolver
  - unrs-resolver

overrides:
  "@types/eslint": "-"

packageExtensions:
  "@es-joy/jsdoccomment":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/js":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/config-helpers":
    peerDependencies:
      eslint: ^9.0.0

  "@types/eslint-plugin-security":
    peerDependencies:
      eslint: ^9.0.0

  eslint-flat-config-utils:
    peerDependencies:
      eslint: ^9.0.0

  eslint-plugin-depend:
    peerDependencies:
      eslint: ^9.0.0

  eslint-import-context:
    peerDependencies:
      "@typescript-eslint/utils": ^8.0.0
    dependencies:
      type-fest: ^4.40.0

  eslint-plugin-import-x:
    peerDependencies:
      "@typescript-eslint/scope-manager": ^8.0.0
      eslint: ^9.0.0
    dependencies:
      type-fest: ^4.40.0

  eslint-plugin-package-json:
    dependencies:
      "@types/estree": ^1.0.6

  eslint-plugin-regexp:
    dependencies:
      "@types/estree": ^1.0.6
      "@types/json-schema": ^7.0.15

  eslint-plugin-tsdoc:
    peerDependencies:
      eslint: ^9.0.0

  jsonc-eslint-parser:
    peerDependencies:
      eslint: ^9.0.0
    dependencies:
      "@types/estree": ^1.0.6

packages:
  - packages/*

catalog:
  "@eslint/config-helpers": ^0.3.1
  ci-info: ^4.3.0
  defu: ^6.1.4
  eslint-flat-config-utils: ^2.1.1
  eslint-typegen: ^2.3.0
  globals: ^16.3.0

catalogs:
  plugins:
    "@eslint-community/eslint-plugin-eslint-comments": ^4.5.0
    "@eslint/js": ^9.33.0
    "@html-eslint/eslint-plugin": ^0.45.0
    "@regru/eslint-plugin-prefer-early-return": ^1.0.0
    "@stylistic/eslint-plugin": ^5.2.3
    "@vitest/eslint-plugin": ^1.3.4
    confusing-browser-globals: ^1.0.11
    eslint-config-flat-gitignore: ^2.1.0
    eslint-no-restricted: ^0.0.8
    eslint-plugin-better-tailwindcss: ^3.7.4
    eslint-plugin-de-morgan: ^1.3.1
    eslint-plugin-command: ^3.3.1
    eslint-plugin-depend: ^1.2.0
    eslint-plugin-import-x: ^4.16.1
    eslint-plugin-jsdoc: ^54.0.0
    eslint-plugin-n: ^17.21.3
    eslint-plugin-no-use-extend-native: ^0.7.2
    eslint-plugin-package-json: ^0.52.1
    eslint-plugin-perfectionist: ^4.15.0
    eslint-plugin-pnpm: ^1.1.0
    eslint-plugin-promise: ^7.2.1
    eslint-plugin-regexp: ^2.10.0
    eslint-plugin-security: ^3.0.1
    eslint-plugin-sonarjs: ^3.0.4
    eslint-plugin-svelte: ^3.11.0
    eslint-plugin-tsdoc: ^0.4.0
    eslint-plugin-turbo: ^2.5.5
    eslint-plugin-unicorn-x: ^3.2.1
    typescript-eslint: ^8.39.1

  parsers:
    "@typescript-eslint/parser": ^8.39.1
    jsonc-eslint-parser: ^2.4.0
    svelte-eslint-parser: ^1.3.1
    yaml-eslint-parser: ^1.3.0

  peers:
    "@types/node": ^20.19.0 || ^22.12.0 || >=24.0.0
    eslint: ^9.31.0
    svelte: ^5.0.0
    tailwindcss: ^4.0.0
    typescript: ">=5.9.0"
    turbo: ^2.0.0

  dev:
    "@arethetypeswrong/core": ^0.18.2
    "@eslint/config-inspector": ^1.1.0
    "@manypkg/cli": ^0.25.0
    "@prettier/plugin-oxc": ^0.0.4
    eslint: ^9.33.0
    jiti: ^2.5.1
    knip: ^5.62.0
    node-modules-inspector: ^1.0.0
    prettier: ^3.6.2
    publint: ^0.3.12
    svelte: ^5.38.1
    tailwindcss: ^4.1.11
    tsdown: ^0.14.1
    turbo: ^2.5.5
    typescript: ~5.9.2
    typesync: ^0.14.3
    unplugin-unused: ^0.5.1
    update-ts-references: ^3.6.2

  types:
    "@types/confusing-browser-globals": ~1.0.3
    "@types/eslint-plugin-security": ~3.0.0
    "@types/node": ^24.2.1
