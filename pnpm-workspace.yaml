hoist: false
strictPeerDependencies: true
autoInstallPeers: false
strictDepBuilds: true
shellEmulator: true
engineStrict: true
nodeVersion: "20.19.0"

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  "@types/eslint": "-"

packageExtensions:
  "@es-joy/jsdoccomment":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/js":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/config-helpers":
    peerDependencies:
      eslint: ^9.0.0

  "@types/eslint-plugin-security":
    peerDependencies:
      eslint: ^9.0.0

  eslint-flat-config-utils:
    peerDependencies:
      eslint: ^9.0.0

  eslint-plugin-depend:
    peerDependencies:
      eslint: ^9.0.0

  eslint-import-context:
    peerDependencies:
      "@typescript-eslint/utils": ^8.0.0
    dependencies:
      type-fest: ^4.40.0

  eslint-plugin-import-x:
    peerDependencies:
      "@typescript-eslint/scope-manager": ^8.0.0
      eslint: ^9.0.0
    dependencies:
      type-fest: ^4.40.0

  eslint-plugin-package-json:
    dependencies:
      "@types/estree": ^1.0.6

  eslint-plugin-regexp:
    dependencies:
      "@types/estree": ^1.0.6
      "@types/json-schema": ^7.0.15

  eslint-plugin-tsdoc:
    peerDependencies:
      eslint: ^9.0.0

  jsonc-eslint-parser:
    peerDependencies:
      eslint: ^9.0.0
    dependencies:
      "@types/estree": ^1.0.6

packages:
  - packages/*

catalog:
  "@eslint/config-helpers": ^0.3.0
  ci-info: ^4.2.0
  defu: ^6.1.4
  eslint-flat-config-utils: ^2.1.0
  eslint-typegen: ^2.2.0
  globals: ^16.2.0

catalogs:
  plugins:
    "@eslint-community/eslint-plugin-eslint-comments": ^4.5.0
    "@eslint/js": ^9.30.0
    "@html-eslint/eslint-plugin": ^0.42.0
    "@regru/eslint-plugin-prefer-early-return": ^1.0.0
    "@stylistic/eslint-plugin": ^5.1.0
    "@vitest/eslint-plugin": ^1.3.3
    confusing-browser-globals: ^1.0.11
    eslint-config-flat-gitignore: ^2.1.0
    eslint-no-restricted: ^0.0.8
    eslint-plugin-de-morgan: ^1.3.0
    eslint-plugin-command: ^3.3.1
    eslint-plugin-depend: ^1.2.0
    eslint-plugin-import-x: ^4.16.1
    eslint-plugin-jsdoc: ^51.3.1
    eslint-plugin-n: ^17.20.0
    eslint-plugin-no-use-extend-native: ^0.7.2
    eslint-plugin-package-json: ^0.42.0
    eslint-plugin-perfectionist: ^4.15.0
    eslint-plugin-pnpm: ^0.3.1
    eslint-plugin-promise: ^7.2.1
    eslint-plugin-regexp: ^2.9.0
    eslint-plugin-security: ^3.0.1
    eslint-plugin-sonarjs: ^3.0.4
    eslint-plugin-svelte: ^3.10.1
    eslint-plugin-tsdoc: ^0.4.0
    eslint-plugin-turbo: ^2.5.4
    eslint-plugin-unicorn-x: ^3.0.0
    typescript-eslint: ^8.35.1

  parsers:
    "@typescript-eslint/parser": ^8.35.1
    jsonc-eslint-parser: ^2.4.0
    svelte-eslint-parser: ^1.2.0
    yaml-eslint-parser: ^1.3.0

  peers:
    "@types/node": ^20.19.0 || ^22.12.0 || >=24.0.0
    eslint: ^9.28.0
    svelte: ^5.0.0
    typescript: ">=5.8.0"
    turbo: ^2.0.0

  dev:
    "@eslint/config-inspector": ^1.1.0
    "@manypkg/cli": ^0.24.0
    "@prettier/plugin-oxc": ^0.0.4
    eslint: ^9.30.0
    jiti: ^2.4.2
    knip: ^5.61.3
    node-modules-inspector: ^1.0.0
    prettier: ^3.6.2
    svelte: ^5.34.9
    tsdown: ^0.12.9
    turbo: ^2.5.4
    typescript: ~5.8.3
    typesync: ^0.14.3

  types:
    "@types/confusing-browser-globals": ~1.0.3
    "@types/eslint-plugin-security": ~3.0.0
    "@types/node": ^24.0.7
