hoist: false
strictPeerDependencies: true
autoInstallPeers: false
strictDepBuilds: true
engineStrict: true
nodeVersion: "20.18.0"

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  "@types/eslint": "-"

packageExtensions:
  "@es-joy":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/js":
    peerDependencies:
      eslint: ^9.0.0

  "@eslint/config-helpers":
    peerDependencies:
      eslint: ^9.0.0

  "@types/eslint-plugin-security":
    peerDependencies:
      eslint: ^9.0.0

  eslint-flat-config-utils:
    peerDependencies:
      eslint: ^9.0.0

  eslint-plugin-depend:
    peerDependencies:
      eslint: ^9.0.0

  eslint-plugin-import-x:
    peerDependencies:
      "@typescript-eslint/scope-manager": ^8.0.0
      eslint: ^9.0.0
    dependencies:
      type-fest: ^4.40.0

  eslint-plugin-tsdoc:
    peerDependencies:
      eslint: ^9.0.0

  jsonc-eslint-parser:
    peerDependencies:
      eslint: ^9.0.0

packages:
  - packages/*

catalog:
  "@eslint/config-helpers": ^0.2.2
  "@eslint/config-inspector": ^1.0.2
  "@manypkg/cli": ^0.24.0
  ci-info: ^4.2.0
  defu: ^6.1.4
  eslint-flat-config-utils: ^2.1.0
  eslint-typegen: ^2.2.0
  globals: ^16.2.0
  node-modules-inspector: ^0.6.8
  prettier: ^3.5.3
  typesync: ^0.14.3

catalogs:
  plugins:
    "@eslint-community/eslint-plugin-eslint-comments": ^4.5.0
    "@eslint/js": ^9.27.0
    "@html-eslint/eslint-plugin": ^0.41.0
    "@regru/eslint-plugin-prefer-early-return": ^1.0.0
    "@stylistic/eslint-plugin": ^4.4.0
    "@vitest/eslint-plugin": ^1.2.1
    confusing-browser-globals: ^1.0.11
    eslint-config-flat-gitignore: ^2.1.0
    eslint-import-resolver-typescript: ^4.4.1
    eslint-no-restricted: ^0.0.8
    eslint-plugin-de-morgan: ^1.2.1
    eslint-plugin-command: ^3.2.1
    eslint-plugin-depend: ^1.2.0
    eslint-plugin-import-x: ^4.13.3
    eslint-plugin-jsdoc: ^50.6.17
    eslint-plugin-n: ^17.18.0
    eslint-plugin-no-use-extend-native: ^0.7.2
    eslint-plugin-package-json: ^0.31.0
    eslint-plugin-perfectionist: ^4.13.0
    eslint-plugin-pnpm: ^0.3.1
    eslint-plugin-promise: ^7.2.1
    eslint-plugin-regexp: ^2.7.0
    eslint-plugin-security: ^3.0.1
    eslint-plugin-sonarjs: ^3.0.2
    eslint-plugin-svelte: ^3.9.0
    eslint-plugin-tsdoc: ^0.4.0
    eslint-plugin-turbo: ^2.5.3
    eslint-plugin-unicorn-x: ^1.0.8
    typescript-eslint: ^8.33.0

  parsers:
    "@typescript-eslint/parser": ^8.33.0
    jsonc-eslint-parser: ^2.4.0
    svelte-eslint-parser: ^1.2.0
    yaml-eslint-parser: ^1.3.0

  peers:
    "@types/node": ^20.17.0 || ^22.10.0 || >=24.0.0
    eslint: ^9.27.0
    svelte: ^5.0.0
    typescript: ">=5.8.0"
    turbo: ^2.0.0

  dev:
    eslint: ^9.27.0
    jiti: ^2.4.2
    svelte: ^5.33.4
    tsdown: ^0.12.4
    turbo: ^2.5.3
    typescript: ~5.8.3

  types:
    "@types/confusing-browser-globals": ~1.0.3
    "@types/eslint-plugin-security": ~3.0.0
    "@types/node": ^22.15.24
